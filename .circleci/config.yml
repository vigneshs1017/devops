version: 2.1
orbs:
  aws-ecr: circleci/aws-ecr@7.2.0
  snyk: snyk/snyk@1.4.0

jobs:
  SAST:
    docker:
      - image: snyk/snyk:alpine
    parameters:
      fail_if_vul:
        type: boolean
        default: false
    steps:
      - checkout
      - run:
          name: SAST
          command: |
            snyk auth ${SNYK_TOKEN}
            snyk code test all --severity-threshold=high
            if [[ << parameters.fail_if_vul >> == true ]]; then
              snyk code test --severity-threshold=high --fail-on=high
            fi 
      
  scan_application:
    parameters:
      fail_if_vul:
        type: boolean
        default: false
    docker:
    - image: cimg/node:lts
    steps:
    - checkout
    - run:
        name: Sync code for application
        command: npm install
    - snyk/scan:
        token-variable: SNYK_TOKEN                          
        severity-threshold: high                                
        fail-on-issues: << parameters.fail_if_vul >> 
        project: ${CIRCLE_PROJECT_REPONAME}/${CIRCLE_BRANCH}
        monitor-on-build: true                                   
        additional-arguments: "--print-deps --detection-depth=3 --json-file-output=vuln.json"
        
  scan_build_docker_image:
    parameters:
      fail_if_vul:
        type: boolean
        default: false
    docker:
        - image: circleci/buildpack-deps:stretch
    steps:
      - checkout
      - setup_remote_docker
      - aws-ecr/build-image:
          ecr-login: true
          region: AWS_REGION
          account-url: AWS_ECR_ACCOUNT_URL
          repo: $AWS_ECR_REPO
          tag: 0.1.<< pipeline.number >>
      - snyk/scan:
          docker-image-name: $AWS_ECR_ACCOUNT_URL/$AWS_ECR_REPO:0.1.<< pipeline.number >>
          fail-on-issues: << parameters.fail_if_vul >>
          project: ${CIRCLE_PROJECT_REPONAME}/${CIRCLE_BRANCH}
          monitor-on-build: true
          severity-threshold: critical
          target-file: Dockerfile
          token-variable: SNYK_TOKEN
      - aws-ecr/push-image:
          account-url: AWS_ECR_ACCOUNT_URL
          repo: $AWS_ECR_REPO
          tag: 0.1.<< pipeline.number >>  
  
workflows:
  build:
    jobs:
      - SAST:
          name: SAST
          fail_if_vul: true
          filters:
            branches:
              only:
                - stage
                - acc
                - main
                - prod
                - dev
            tags:
              ignore:
                - /v\d+\.\d+\.\d+$/
                
      - scan_application:
          name: Application-Scan-Pre-Prods
          fail_if_vul: true
          filters:
            branches:
              only:
                - stage
                - acc
                - main
                - prod
            tags:
              ignore:
                - /v\d+\.\d+\.\d+$/
          requires:
             - SAST

      - scan_application:
          name: Application-Scan-Development
          fail_if_vul: false
          filters:
            branches:
              only:
                - dev
            tags:
              ignore:
                - /v\d+\.\d+\.\d+$/
          requires:
             - SAST

      - scan_build_docker_image:
          name: Image-Scan-Development
          fail_if_vul: false
          filters:
            branches:
              only:
                - dev
            tags:
              ignore:
                - /v\d+\.\d+\.\d+$/
          requires:
            - Application-Scan-Development
            - SAST

      - scan_build_docker_image:
          name: Image-Scan-Pre-Prod/Production
          fail_if_vul: true
          filters:
            branches:
              only:
                - stage
                - acc
                - main
                - prod
            tags:
              ignore:
                - /v\d+\.\d+\.\d+$/
          requires:
            - Application-Scan-Pre-Prods
            - SAST
